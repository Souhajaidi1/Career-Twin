server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: career
          uri: ${CAREER_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/profile/**,/api/v1/evidence/**,/api/v1/goals/**,/api/v1/catalog/**,/api/v1/analysis/**
        - id: jobs
          uri: ${JOB_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/jobs/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
