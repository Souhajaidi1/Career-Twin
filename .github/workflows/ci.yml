name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests (*IT) use Testcontainers; the runner provides Docker.
      - run: mvn -B verify

  frontend:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, career-service, job-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build (not pushed)
        run: docker build -f Dockerfile.service --build-arg MODULE=${{ matrix.service }} -t careertwin/${{ matrix.service }}:ci .
